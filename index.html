<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I am KOKI | 清水航樹</title>
<meta name="description" content="清水航樹の自己紹介サイト。行動力・好奇心・体力を軸に、旅・人との出会い・スポーツを紹介します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="logo" href="index.html">I am <span>KOKI</span></a>
    <button class="nav-toggle" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav">
      <a href="index.html" aria-current="page">I am KOKI</a>
      <a href="world.html">あぁ素晴らしき地球</a>
      <a href="people.html">世界のクセ強人類</a>
      <a href="sports.html">身体こそすべて</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="ambient-bg egypt" id="egyptBg" aria-hidden="true">
      <svg class="egypt-layer" data-depth="0.02" viewBox="0 0 200 200"><circle class="egypt-sun" cx="100" cy="90" r="50"/></svg>
      <svg class="egypt-layer" data-depth="0.05" viewBox="0 0 300 180"><polygon class="egypt-pyramid egypt-pyramid--1" points="90,20 190,170 -10,170"/></svg>
      <svg class="egypt-layer" data-depth="0.08" viewBox="0 0 300 180"><polygon class="egypt-pyramid egypt-pyramid--2" points="180,50 270,170 90,170"/></svg>
      <svg class="egypt-layer" data-depth="0.03" viewBox="0 0 300 40" preserveAspectRatio="none"><path class="egypt-dune" d="M0,20 Q75,0 150,20 T300,20 V40 H0 Z"/></svg>
    </div>
    <div class="wrap hero__inner">
      <div class="hero__photo reveal">
        <img id="hero-photo" src="" alt="">
        <div class="hero__photo-overlay">
          <h1 class="hero__title" id="hero-name"></h1>
          <p class="hero__tagline" id="hero-tagline"></p>
        </div>
      </div>
      <div class="hero__foot">
        <p class="hero__photo-caption" id="hero-photo-caption"></p>
        <p class="hero__meta" id="hero-meta"></p>
      </div>
    </div>
  </section>

  <section class="strengths">
    <div class="wrap">
      <h2 class="section-title reveal">強み</h2>
      <div class="strengths__grid reveal-stagger">
        <a class="strength-card reveal" style="--i:0" href="world.html">
          <h3>行動力</h3>
          <p>知らない場所へ行くこと</p>
          <span class="strength-card__link">世界地図を見る →</span>
        </a>
        <a class="strength-card reveal" style="--i:1" href="people.html">
          <h3>好奇心</h3>
          <p>知らない人に話しかけること</p>
          <span class="strength-card__link">人図鑑を見る →</span>
        </a>
        <a class="strength-card reveal" style="--i:2" href="sports.html">
          <h3>体力</h3>
          <p>身体能力</p>
          <span class="strength-card__link">スポーツを見る →</span>
        </a>
      </div>
    </div>
  </section>

  <section class="profile-extra">
    <div class="wrap profile-extra__grid reveal-stagger">
      <div class="info-card reveal" style="--i:0">
        <span class="info-card__tag">職歴</span>
        <ul class="career-list" id="home-career"></ul>
      </div>
      <div class="info-card reveal" style="--i:1">
        <span class="info-card__tag">趣味・活動</span>
        <p class="info-card__stat"><strong id="home-stat-countries"></strong><span>カ国制覇</span></p>
        <div class="tag-list" id="home-hobbies"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">&copy; 2026 Koki Shimizu</div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/index.js"></script>
</body>
</html>
